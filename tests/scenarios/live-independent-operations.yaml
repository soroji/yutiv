name: 업체별 독립 라이브 운영
description: YUTIV 쇼핑몰·개인 스토어와 분리된 라이브 업체 도메인, 주문, 재고, 인센티브 검증
extension: yutiv-live_commerce
preconditions:
  - 합성 데이터만 있는 격리 MySQL 데이터베이스
  - 실제 결제·메일·송금·유료 API 차단
  - 등록 도메인별 독립 고객 및 직원 계정
scenarios:
  - name: 업체 경계
    steps:
      - 다른 업체 브랜드·계정·주문·재고 API 접근 시도
      - URL query/body tenant 변경 및 미등록 호스트 접근
    expected: 서버 컨텍스트 유지 및 타 업체 조회·수정 차단
  - name: 원본 라인과 재고
    steps:
      - 동일 옵션을 직접 판매와 판매 링크로 각각 담고 로그인 시 병합
      - 라인 순서를 바꿔 주문하고 동일 작업키로 재전송
      - 동시 주문·부분 출고·중복 QR·만료 및 늦은 입금 검토
    expected: UUID·귀속·예약 보존, 초과 판매와 이중 차감 없음
  - name: 인센티브 복구
    steps:
      - 입금·배송 완료·확정·지급 후 부분 반품과 환불 기록
      - 동일 이벤트 재전송 및 누적 대사 반복
      - 귀속 정정 후 회수 기록
    expected: 원본 보존, 취소·반품과 금융 환불 이중 회수 없음
  - name: 운영 화면
    steps:
      - PC 1440·1920px 및 모바일 390px에서 저장 후 새로고침
      - 빈 상태·권한 오류·긴 상품명·카메라 미지원·오프라인 확인
      - 선택 QR 라벨 PDF 및 디코딩
    expected: 실제 자산 로드, 개인정보 최소 노출, 스캔 후 별도 확정
